# riscv-formal checks for BOOM (Spinal port), small config (NRET = 1).
#
# BOOM needs many cycles after reset before it retires anything (metadata array
# reset, I$ refill, the front of an out-of-order pipeline), so the depths here are
# far beyond what typical in-order cores need and the checks are slow. The
# `cover` check reports how deep the first retirement is.

[options]
isa rv64imc
nret 1
solver bitwuzla

[depth]
cover           1 150
insn              150
reg          100  150
pc_fwd       100  150
pc_bwd       100  150
causal       100  150
unique       100 120 150
ill               150

[sort]
reg_ch0

[defines]
`define YOSYS
`define RISCV_FORMAL_ALIGNED_MEM
// BoomFormalTop maps only 0x8000_0000-0x8fff_ffff; anything else is an access fault
`define RISCV_FORMAL_VALIDADDR(addr) ((addr) >= 64'h80000000 && (addr) < 64'h90000000)

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/BoomFormalTop.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 1);
